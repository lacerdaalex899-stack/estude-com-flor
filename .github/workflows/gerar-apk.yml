name: Gerar APK do Estude com Flor

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Conferir Android SDK
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls $ANDROID_HOME/platforms || true

      - name: Instalar dependências
        run: npm ci

      - name: Copiar o app para o projeto Android
        run: npx cap sync android

      - name: Compilar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Renomear
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Estude-com-Flor.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Estude-com-Flor-APK
          path: Estude-com-Flor.apk

      - name: Publicar APK para download direto
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Estude com Flor v1.0.${{ github.run_number }}
          body: Baixe o arquivo Estude-com-Flor.apk abaixo pelo celular e instale.
          files: Estude-com-Flor.apk
          make_latest: true
