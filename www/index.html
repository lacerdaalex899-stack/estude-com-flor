<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#e75480">
<title>Estude com Flor</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <!-- Tela de boas-vindas / configuração inicial -->
  <section id="setup" class="screen hidden"></section>

  <!-- Tela principal -->
  <section id="main" class="screen hidden">
    <header class="top">
      <button class="icon-btn" id="btnMenu" aria-label="Menu"></button>
      <div class="ai-id">
        <div class="avatar" id="aiAvatar"></div>
        <div class="ai-text">
          <div class="ai-name" id="aiName">Flor</div>
          <div class="ai-sub" id="aiSub">Estude com Flor</div>
        </div>
      </div>
      <button class="icon-btn" id="btnNew" aria-label="Novo chat"></button>
      <button class="icon-btn" id="btnSettings" aria-label="Configurações"></button>
    </header>

    <div id="messages" class="messages"></div>

    <footer class="composer-wrap">
      <div class="chips" id="chips"></div>
      <div class="pending" id="pending"></div>
      <div class="mode-pill hidden" id="modePill"></div>
      <div class="composer">
        <button class="icon-btn attach" id="btnAttach" aria-label="Anexar"></button>
        <textarea id="input" rows="1" placeholder="Pergunte, envie arquivos, imagens ou links…"></textarea>
        <button class="send" id="btnSend" aria-label="Enviar"></button>
      </div>
    </footer>
  </section>
</div>

<!-- Gaveta lateral -->
<div id="drawerShade" class="shade hidden"></div>
<aside id="drawer" class="drawer"></aside>

<!-- Menu de anexos -->
<div id="attachMenu" class="sheet hidden">
  <button data-act="camera"><span>📷</span>Câmera</button>
  <button data-act="images"><span>🖼️</span>Imagens</button>
  <button data-act="files"><span>📎</span>Arquivos (PDF, Word, Excel, PowerPoint, textos…)</button>
  <button data-act="link"><span>🔗</span>Link</button>
</div>

<input type="file" id="fileCamera" accept="image/*" capture="environment" hidden>
<input type="file" id="fileImages" accept="image/*" multiple hidden>
<input type="file" id="fileAny" multiple hidden>
<input type="file" id="fileImport" accept=".json,application/json" hidden>

<!-- Modal genérico -->
<div id="modalShade" class="shade hidden"></div>
<div id="modal" class="modal hidden"></div>

<div id="toast" class="toast hidden"></div>

<script src="lib/marked.js"></script>
<script src="lib/purify.min.js"></script>
<script src="lib/jszip.min.js"></script>
<script src="lib/mammoth.js"></script>
<script src="lib/xlsx.js"></script>
<script src="lib/docx.js"></script>
<script src="lib/pptxgen.js"></script>
<script src="app.js"></script>
</body>
</html>
